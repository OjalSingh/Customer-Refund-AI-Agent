[project]
name = "customer-refund-ai-agent"
version = "0.2.0"
description = "Guardrailed refund and fraud-review agent: an LLM reads the request, a deterministic policy engine makes the decision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "requests>=2.32",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
hosted = ["anthropic>=2.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long policy strings and regexes read better unwrapped
