name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Eval suite (offline baseline)
        run: |
          uv run python -m evals.run_evals --min-pass-rate 0.90 \
            --markdown evals/results/offline.md --json evals/results/offline.json
          cat evals/results/offline.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
